name: APK Derle

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  # GitHub'da "Release" yayınlanınca APK o sürüme eklenir
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        # GitHub sunucularında Android SDK hazır kurulu (ANDROID_HOME); eksik platformları Gradle indirir
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk OsintKit.apk

      - name: APK'yı doğrula (imza ve içerik)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs OsintKit.apk
          "$BT/aapt2" dump badging OsintKit.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          ls -lh OsintKit.apk

      - name: APK'yı Actions çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: OsintKit-apk
          path: OsintKit.apk

      - name: Yayınlanan Release'e APK'yı ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OsintKit.apk
